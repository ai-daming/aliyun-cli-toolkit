version: '3'

vars:
  DIST_DIR: dist
  APP_VERSION:
    sh: |
      if [ -n "${ALIYUN_CLI_VERSION:-}" ]; then
        printf "%s" "$ALIYUN_CLI_VERSION"
      else
        printf "%s" "dev"
      fi
  COMMIT:
    sh: |
      commit="$(git rev-parse --short HEAD)"
      if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
        commit="${commit}-dirty"
      fi
      printf "%s" "$commit"
  BUILD_TIME:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X github.com/mamamate/aliyun-cli-toolkit/internal/buildinfo.Version={{.APP_VERSION}}
    -X github.com/mamamate/aliyun-cli-toolkit/internal/buildinfo.Commit={{.COMMIT}}
    -X github.com/mamamate/aliyun-cli-toolkit/internal/buildinfo.BuildTime={{.BUILD_TIME}}
  # Both CLIs in this toolkit
  BINARIES: aliyun-media-cli,aliyun-idcard-cli

env:
  CGO_ENABLED: 0

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -s -w .

  test:
    desc: Run all tests
    cmds:
      - go test ./... -v

  test-cover:
    desc: Run tests with coverage
    cmds:
      - go test ./internal/... -coverprofile=coverage.out -covermode=atomic
      - go tool cover -func=coverage.out | tail -1

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  build:
    desc: Build both CLI binaries
    cmds:
      - for: { var: BINARIES, split: "," }
        cmd: go build -ldflags "{{.LDFLAGS}}" -o bin/{{.ITEM}} ./cmd/{{.ITEM}}

  release:
    desc: Cross-compile release binaries (linux/mac × amd64/arm64)
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - for: { var: BINARIES, split: "," }
        cmd: |
          for PLATFORM in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            OS="${PLATFORM%/*}"
            ARCH="${PLATFORM#*/}"
            GOOS=$OS GOARCH=$ARCH go build -ldflags "{{.LDFLAGS}}" -o {{.DIST_DIR}}/{{.ITEM}}-${OS}-${ARCH} ./cmd/{{.ITEM}}
          done
